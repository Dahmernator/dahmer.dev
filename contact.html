<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Robert Dahmer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <a class="logo" href="index.html">dahmer.dev</a>
    <ul>
      <li><a href="index.html#home">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>

    <section class="hero">
      <div class="hero-text">
        <h1>Contact</h1>
        <p class="tagline">Send me a message and I'll get back to you.</p>
      </div>
    </section>

    <section>
      <form id="contact-form" class="form">
        <!-- Get a free access key at https://web3forms.com and paste it below -->
        <input type="hidden" name="access_key" value="f7e74358-6644-4cbc-9fe8-b3f789991345">
        <input type="hidden" name="subject" value="New message from dahmer.dev">
        <!-- Spam trap: real visitors never see or fill this in -->
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">

        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Your email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button class="btn primary" type="submit">Send message</button>
        <p id="form-status" role="status"></p>
      </form>

      <p>Prefer GitHub? <a href="https://github.com/Dahmernator">github.com/Dahmernator</a></p>
    </section>

  </main>

  <footer>&copy; 2026 Robert Dahmer</footer>

  <script>
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (form.access_key.value.startsWith("YOUR_ACCESS_KEY")) {
        status.textContent = "The form isn't set up yet (missing access key).";
        status.className = "error";
        return;
      }

      status.textContent = "Sending...";
      status.className = "";

      try {
        const res = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: new FormData(form)
        });
        const data = await res.json();
        if (res.ok && data.success) {
          status.textContent = "Thanks! Your message was sent.";
          status.className = "ok";
          form.reset();
        } else {
          status.textContent = "Something went wrong. Please try again later.";
          status.className = "error";
        }
      } catch (err) {
        status.textContent = "Network error. Please try again later.";
        status.className = "error";
      }
    });
  </script>

</body>
</html>
